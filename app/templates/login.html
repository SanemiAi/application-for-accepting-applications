{% extends "base.html" %}
{% block title %}Вход — Система заявок{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto">
  <h2>Вход</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Логин</label>
    <input name="username" required autofocus>
    <label>Пароль</label>
    <input type="password" name="password" required>
    <button>Войти</button>
  </form>
  <p class="muted">Нет аккаунта — обратитесь к администратору.</p>
</div>
{% endblock %}
