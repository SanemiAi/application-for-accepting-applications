<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Система заявок{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f1f5f9; color: #1e293b; }
  header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 24px;
           display: flex; justify-content: space-between; align-items: center; }
  header a { color: #1e293b; text-decoration: none; }
  main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 14px; border-bottom: 1px solid #e2e8f0; text-align: left; font-size: 14px; }
  th { background: #f8fafc; }
  tr:hover td { background: #f8fafc; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 13px; }
  .new { background: #dbeafe; color: #1d4ed8; }
  .in_work { background: #fef9c3; color: #a16207; }
  .done { background: #dcfce7; color: #15803d; }
  .closed { background: #e2e8f0; color: #475569; }
  .prio_low { background: #e0f2fe; color: #0369a1; }
  .prio_medium { background: #f1f5f9; color: #475569; }
  .prio_high { background: #fee2e2; color: #b91c1c; }
  .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  input, textarea, select { width: 100%; padding: 9px 12px; margin: 6px 0 14px;
      border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; font-family: inherit; }
  textarea { min-height: 120px; resize: vertical; }
  button, .btn { display: inline-block; padding: 9px 18px; border: 0; border-radius: 6px;
      background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; text-decoration: none; }
  button:hover, .btn:hover { background: #1d4ed8; }
  .btn-gray { background: #64748b; }
  .btn-green { background: #16a34a; }
  .btn-green:hover { background: #15803d; }
  .btn-red { background: #dc2626; }
  .btn-red:hover { background: #b91c1c; }
  .alert { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
           border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
  .filters { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto auto; gap: 8px; align-items: start; }
  .filters input, .filters select { margin: 0; }
  .inline-form { display: flex; gap: 8px; align-items: flex-start; }
  .inline-form select { margin: 0; flex: 1; }
  .inline-form button { white-space: nowrap; }
  label { font-size: 13px; color: #475569; font-weight: 600; }
  .error { color: #b91c1c; }
  .muted { color: #64748b; font-size: 13px; }
  .comment { border-left: 3px solid #2563eb; padding: 4px 0 4px 12px; margin: 14px 0; }
  .field { margin-bottom: 4px; }
  .field b { display: inline-block; min-width: 140px; color: #475569; font-weight: 600; }
</style>
</head>
<body>
<header>
  <div><a href="/"><b>🗂 Система заявок</b></a></div>
  {% if user %}
  <div>
    {{ user.full_name or user.username }}
    <span class="badge closed">{{ role_label }}</span>
    <form method="post" action="/logout" style="display:inline">
      <button class="btn-gray" style="padding:6px 12px">Выйти</button>
    </form>
  </div>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
