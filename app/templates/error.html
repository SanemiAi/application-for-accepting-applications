{% extends "base.html" %}
{% block title %}Ошибка {{ code }}{% endblock %}
{% block content %}
<div class="card" style="text-align:center;padding:48px 20px">
  <div style="font-size:48px;font-weight:700;color:#cbd5e1">{{ code }}</div>
  <h2>{{ message }}</h2>
  {% if detail and detail != message %}
  <p class="muted">{{ detail }}</p>
  {% endif %}
  <p style="margin-top:16px"><a class="btn" href="/">На главную</a></p>
</div>
{% endblock %}
